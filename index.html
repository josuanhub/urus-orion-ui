<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>URUS — ORION</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">URUS</div>

    <div class="panel">
      <div class="title">Agentes</div>
      <div id="agents"></div>
    </div>

    <div class="panel">
      <div class="title">Insights</div>
      <div id="insights"></div>
    </div>

    <div class="panel">
      <div class="title">Estado</div>
      <div id="status"></div>
    </div>

    <div class="panel">
      <div class="title">Audit</div>
      <div id="audit"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="chat" id="chat"></div>

    <div class="loader hidden" id="loader">
      <span></span><span></span><span></span>
    </div>

    <div class="input-bar">
      <input id="input" placeholder="Habla con ORION..." />
      <button onclick="startVoice()">🎤</button>
      <button onclick="sendMessage()">Enviar</button>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
